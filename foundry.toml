[profile.default]
src = "contracts/src"
auto_detect_remappings = false
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["contracts/lib"]
solc_version = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "@chainlink/contracts-ccip/=contracts/lib/ccip/",
  "@chainlink/local/=contracts/lib/local/",
  "@chainlink/contracts/=contracts/lib/chainlink/",
  "@openzeppelin/contracts/=contracts/lib/openzeppelin/",
  "@openzeppelin/contracts@4.8.3/=contracts/lib/openzeppelin-4.8.3/",
  "@openzeppelin/contracts@5.3.0/=contracts/lib/openzeppelin-5.3.0/"
]

[rpc_endpoints]
sepolia = "${AGENT_SEPOLIA_RPC_URL}"
base_sepolia = "${AGENT_BASE_SEPOLIA_RPC_URL}"
